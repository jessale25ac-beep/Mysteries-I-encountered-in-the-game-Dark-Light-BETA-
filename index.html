<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Log: File 01</title>
    <style>
        body {
            background-color: #f4f4f9; /* Light gray background, clean and organized */
            color: #333333; /* Easy-to-read dark text */
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .contenedor {
            text-align: center;
            border: 1px solid #cccccc;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 500px;
        }
        h1 {
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 20px;
        }
        p {
            font-size: 16px;
            line-height: 1.5;
        }
        /* The hidden text matches the white background color */
        .texto-oculto {
            color: #ffffff; /* Invisible on white background */
            font-size: 12px;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h1>Progress Report - Oakridge Case</h1>
        <!-- Here is your exact sentence in English -->
        <p>this is what i found in the game it's my first investigation :3</p>
    </div>

    <!-- SECRET MESSAGE: The player must highlight with the mouse or press CTRL+A to reveal it -->

</body>
</html>
